<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Luna · BellezaAI</title>
<style>body{margin:0;background:#0d0d0e;color:#f7f2ea;font:17px system-ui}main{max-width:600px;margin:auto;padding:24px}h1{color:#eac58f}button,a{color:#eac58f}button{border:1px solid #eac58f;border-radius:12px;background:#24201b;padding:12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;background:#19191b;color:#fff;border:1px solid #8d795c;border-radius:12px;padding:12px;font:inherit}article,#summary{background:#19191b;border:1px solid #353232;border-radius:16px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}article[data-role=user]{border-color:#8d795c}#error{color:#ffd3b1}form{display:grid;gap:12px}#summary:empty{display:none}</style>
<main><h1>Luna ✦</h1><p>Tu asistente para elegir un servicio y reservar en el salón.</p><a id="fallback">Reservar paso a paso</a><section id="messages" aria-live="polite"><article>Hola, soy Luna. ¿Qué servicio te gustaría y para qué día?</article></section><div id="summary"></div><p id="error" role="alert"></p><form><label for="message">Tu mensaje</label><textarea id="message" maxlength="1200" required rows="3"></textarea><button id="send">Enviar</button></form></main>
<script>
const id=location.pathname.split('/').pop(),base='/api/public/salons/'+encodeURIComponent(id),history=[];
const messages=document.querySelector('#messages'),summary=document.querySelector('#summary'),error=document.querySelector('#error'),text=document.querySelector('#message'),send=document.querySelector('#send');
document.querySelector('#fallback').href='/reservar/'+encodeURIComponent(id);
let busy=false,proposal=null;
function bubble(role,content){const el=document.createElement('article');el.dataset.role=role;el.textContent=content;messages.append(el);}
async function request(path,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),140000);try{const res=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo completar la solicitud.');return data;}catch(e){if(e.name==='AbortError')throw Error('La conexión está tardando. Reintenta; la reserva no se duplicará.');throw e;}finally{clearTimeout(timer);}}
function showProposal(value){summary.replaceChildren();proposal=value;if(!value)return;const details=document.createElement('p');details.textContent=value.serviceName+'\n'+new Intl.DateTimeFormat('es',{dateStyle:'full',timeStyle:'short',timeZone:value.timezone}).format(new Date(value.startsAt))+'\n'+(value.price||'Precio no registrado')+'\n'+value.name+' · '+value.phone;const confirm=document.createElement('button');confirm.type='button';confirm.textContent='Confirmar cita';confirm.onclick=async()=>{if(busy)return;busy=true;confirm.disabled=true;send.disabled=true;text.disabled=true;error.textContent='Confirmando…';try{const receipt=await request('/bookings',proposal);bubble('assistant','Cita confirmada. Referencia: '+receipt.reference);summary.replaceChildren();const link=document.createElement('a');link.href=receipt.managePath;link.textContent='Ver y gestionar mi cita';summary.append(link);proposal=null;error.textContent='';}catch(e){error.textContent=e.message;confirm.disabled=false;}finally{busy=false;send.disabled=false;text.disabled=false;}};summary.append(details,confirm);}
document.querySelector('form').onsubmit=async event=>{event.preventDefault();if(busy||!text.value.trim())return;const message=text.value.trim();busy=true;send.disabled=true;text.disabled=true;error.textContent='Luna está consultando…';showProposal(null);try{const data=await request('/luna',{message,history});bubble('user',message);bubble('assistant',data.reply);history.push({role:'user',content:message},{role:'assistant',content:data.reply});if(history.length>12)history.splice(0,history.length-12);text.value='';showProposal(data.proposal);error.textContent='';}catch(e){error.textContent=e.message;}finally{busy=false;send.disabled=false;text.disabled=false;}};
</script></html>
