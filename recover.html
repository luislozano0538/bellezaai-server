<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Recuperar acceso · BellezaAI</title>
<style>body{margin:0;background:#f6f0f7;color:#302333;font:16px system-ui;display:grid;min-height:100dvh;place-items:center}main{background:white;padding:28px;border-radius:24px;width:min(400px,85vw)}h1{font-size:26px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #cdbacf;font:inherit}button{background:#703c79;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#703c79}p{line-height:1.5}[hidden]{display:none!important}</style></head>
<body><main><h1 id="title">Recuperar acceso</h1><p id="intro">Te enviaremos un enlace para cambiar tu contraseña de BellezaAI.</p>
<form id="request" hidden><label>Correo de tu cuenta<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button>Enviar enlace</button></form>
<form id="reset" hidden><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label>Repite la contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><p>Al menos 12 caracteres. Al cambiarla se cerrarán tus sesiones anteriores.</p><button>Cambiar contraseña</button></form>
<p id="status" role="status" aria-live="polite">Comprobando disponibilidad…</p><p><a href="/">Volver a iniciar sesión</a></p><p><a id="again" href="/recuperar" hidden>Solicitar un enlace nuevo</a></p>
</main><script>
(() => {
 const status=document.getElementById('status'),request=document.getElementById('request'),reset=document.getElementById('reset');
 let token=location.hash.slice(1);
 history.replaceState(null,'',location.pathname);
 async function send(path,body){
   const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   const data=await r.json();if(!r.ok)throw Error(data.error||'Inténtalo más tarde.');return data;
 }
 if(token){
   document.getElementById('again').hidden=false;
   if(!/^[A-Za-z0-9_-]{43}$/.test(token)){status.textContent='El enlace no es válido. Solicita uno nuevo.';token='';return;}
   document.getElementById('title').textContent='Nueva contraseña';
   document.getElementById('intro').textContent='El enlace sirve una sola vez y caduca en 30 minutos. Si recargas esta página, vuelve a abrir el enlace del correo.';
   reset.hidden=false;status.textContent='';
 } else {
   fetch('/api/auth/recovery',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{
     request.hidden=!data.enabled;
     status.textContent=data.enabled?'':'La recuperación por correo todavía no está disponible.';
   }).catch(()=>status.textContent='No pudimos comprobar la disponibilidad. Intenta más tarde.');
 }
 request.onsubmit=async event=>{
   event.preventDefault();const button=request.querySelector('button');button.disabled=true;status.textContent='Procesando solicitud…';
   try {const data=await send('/api/auth/forgot-password',{email:request.elements.email.value});status.textContent=data.message;}
   catch(error){status.textContent=error.message||'No se pudo enviar la solicitud.';}
   finally{button.disabled=false;}
 };
 reset.onsubmit=async event=>{
   event.preventDefault();const password=reset.elements.password.value;
   if(password!==reset.elements.confirmation.value){status.textContent='Las contraseñas no coinciden.';return;}
   if(new TextEncoder().encode(password).length>72){status.textContent='La contraseña supera 72 bytes. Los acentos y emojis ocupan más espacio.';return;}
   const button=reset.querySelector('button');button.disabled=true;status.textContent='Guardando…';
   try {const data=await send('/api/auth/reset-password',{token,password});status.textContent=data.message;token='';reset.reset();reset.hidden=true;try{localStorage.removeItem('bellezaAIToken');}catch{}}
   catch(error){status.textContent=error.message||'No pudimos confirmar el cambio. Intenta iniciar sesión antes de repetirlo.';}
   finally{button.disabled=false;}
 };
})();
</script></body></html>
