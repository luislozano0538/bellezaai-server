services:
  - type: web
    name: bellezaai-staging-api
    runtime: node
    branch: mobile-app-foundation
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: bellezaai-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol

databases:
  - name: bellezaai-staging-db
    plan: free
    region: ohio
    databaseName: bellezaai_staging
    user: bellezaai_staging
